# CI for wear-dsh-release.
#
# Action versions are pinned to major-version tags (stable references);
# no commit hashes are vendored here. Tool versions match docs/ONBOARDING.md:
# JDK 17 (Temurin), Android SDK 35, Node 26 for the bridge, pnpm 10.15.1
# via npx for the plugins, stdlib-only Python 3 for tools/.
#
# Nothing in this workflow touches a live DSH installation, restarts a
# harness, or publishes anything: the bundle job builds a --local
# candidate (gates are open pre-release) and uploads it as a CI artifact.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools-verify:
    name: tools verification (Python, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: release verification entrypoint
        run: ./tools/verify.sh

  bridge:
    name: bridge tests (Node 26, loopback only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: bridge test suite (zero dependencies)
        run: cd bridge && node --test *.test.mjs

  plugins-watch:
    name: watch plugin checks (Node ${{ matrix.node }}, portable)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: dsh-watch clean check (typecheck -> build -> test)
        run: |
          cd plugins/dsh-watch
          npx --yes pnpm@10.15.1 install --frozen-lockfile
          npx --yes pnpm@10.15.1 run check

  plugins-voice:
    name: voice plugin checks (Node ${{ matrix.node }}, macOS)
    strategy:
      matrix:
        node: ['22.19.0', '26']
    # The voice suite covers macOS-only installer apply paths (helper
    # codesign, runtime staging with the fake toolchain, darwin-gated
    # specs). Those specs skip on Linux, so the full suite — including
    # the deploy test that needs a prior build — runs on macOS where the
    # coverage is real. Portable voice behavior is also exercised here;
    # nothing claims Linux-only installer coverage.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: build universal native helper FROM CHECKOUT (macOS only, no capture)
        run: plugins/dsh-live-voice/scripts/build-watch-helpers.sh --apply
      - name: dsh-live-voice clean check (server/client -> build -> ALL tests serialized)
        # Same check stages/assertions/default deadlines; installer processes
        # otherwise contend near Vitest's 5s budget on macOS. No filters/skips.
        run: |
          cd plugins/dsh-live-voice
          npx --yes pnpm@10.15.1 install --frozen-lockfile
          npx --yes pnpm@10.15.1 run typecheck
          npx --yes pnpm@10.15.1 run build
          npx --yes pnpm@10.15.1 exec vitest run --maxWorkers=1 --fileParallelism=false

      - name: inspect packed runtime (compiled helper hash/source/arch provenance)
        run: |
          tmp=$(mktemp -d)
          (cd plugins/dsh-live-voice && npm pack --ignore-scripts --offline --pack-destination "$tmp")
          python3 tools/inspect-artifacts.py --archive "$tmp"/*.tgz
          rm -rf "$tmp"

  android:
    name: android (test, lint, debug-installable + unsigned release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # setup-android's default package list includes the retired SDK `tools`
      # package. Install only platform-tools here; the next step explicitly
      # installs the compile SDK and Build Tools versions this project needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: install SDK 35 + build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # Do not inherit a hosted-runner debug keystore of unknown provenance.
      # This is Android's documented generic DEBUG/DEV identity, created only
      # in the ephemeral runner HOME; no production signing material exists.
      - name: generate isolated standard Android debug key
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: unit tests (debug)
        run: cd watch-app && ./gradlew :app:testDebugUnitTest
      - name: lint (debug AND release)
        run: cd watch-app && ./gradlew :app:lintDebug :app:lintRelease
      - name: fresh-install DEBUG/DEV APK (generic generated Android debug key only)
        run: cd watch-app && ./gradlew :app:assembleDebug
      - name: verify generic DEBUG signature (never production signed)
        run: python3 tools/inspect-apk.py --apk watch-app/app/build/outputs/apk/debug/app-debug.apk
      - name: upload DEBUG/DEV fresh-install APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-debug-installable-dev
          path: watch-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: unsigned release APK (requires owner signing key before installation)
        run: cd watch-app && ./gradlew :app:assembleRelease
      - name: upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-unsigned-release
          path: watch-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  assets:
    name: asset + SBOM validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: asset sets
        run: python3 tools/validate-assets.py
      - name: shipped-binary metadata
        run: python3 tools/inspect-binaries.py
      - name: SBOM generation (references only, no weights)
        run: python3 tools/sbom.py --out /tmp/sbom-ci.json && cat /tmp/sbom-ci.json

  installer-dryrun:
    name: installer dry-runs (isolated temp HOME)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plan-mode installers, temp HOME, residue check
        run: ./tools/installer-dryrun.sh

  bundle-local:
    name: local release candidate (gates open → --local)
    runs-on: ubuntu-latest
    needs: [tools-verify, bridge, plugins-watch, plugins-voice, android, assets, installer-dryrun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: build local candidate (GATE-STATUS sidecar, never for publication)
        run: ./tools/release-bundle.sh --local
      - name: upload local candidate
        uses: actions/upload-artifact@v4
        with:
          name: wear-dsh-local-candidate
          path: dist/
          if-no-files-found: error
